<!doctype html>
<html lang="hr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Jednostavan popis zadataka za probnu GitHub Pages objavu."
    />
    <title>Mali planer</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <h1>Mali planer</h1>
      <p>Dodaj zadatke i prati koliko si ih završio.</p>

      <form id="obrazac">
        <label for="novi-zadatak">Novi zadatak</label>
        <div class="unos">
          <input id="novi-zadatak" name="zadatak" maxlength="80" required />
          <button type="submit">Dodaj</button>
        </div>
      </form>

      <p id="stanje" role="status"></p>
      <progress id="napredak" max="100" value="0"></progress>
      <p id="prazno">Još nema zadataka.</p>
      <ul id="zadaci"></ul>
    </main>

    <script type="module" src="./script.js"></script>
  </body>
</html>
