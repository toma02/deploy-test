name: Provjeri i objavi mali planer

on:
  push:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  objava:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Preuzmi projekt
        uses: actions/checkout@v4

      - name: Postavi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Instaliraj pakete
        run: npm ci

      - name: Provjeri i izgradi aplikaciju
        run: npm run check

      - name: Postavi GitHub Pages
        uses: actions/configure-pages@v5

      - name: Pripremi datoteke za objavu
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Objavi na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
